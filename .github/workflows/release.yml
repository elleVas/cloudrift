name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish @cloudrift/cli to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match @cloudrift/cli version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing @cloudrift/cli@$PKG_VERSION"

      - name: Lint
        run: pnpm nx run-many -t lint --all --parallel

      # --coverage is what actually makes each project's coverageThreshold
      # (ADR-0090) get checked — Jest silently skips it without that flag.
      # Sequential, not --parallel: see ci.yml for why.
      - name: Test with coverage
        run: pnpm nx run-many -t test --all --coverage

      - name: Package the CLI for npm
        run: pnpm nx package cli

      - name: Generate SBOM
        working-directory: apps/cli/dist
        run: |
          # `npm sbom` reads the installed dependency tree, not just package.json —
          # apps/cli/dist has no node_modules of its own (pnpm hoists to the
          # workspace root), so install the published dependency graph here first.
          # npm publish never includes node_modules regardless, so this is safe.
          npm install --ignore-scripts
          npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json
          npm sbom --sbom-format spdx > sbom.spdx.json

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: apps/cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/cli/dist/sbom.cyclonedx.json apps/cli/dist/sbom.spdx.json

      # HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to elleVas/homebrew-cloudrift
      # (Contents + Pull requests: read & write) — see docs/en/releasing.md#homebrew
      # for the one-time setup. Skips gracefully (doesn't fail the release) until
      # that secret exists, so npm publish is never blocked by tap plumbing.
      #
      # This only generates the "bare" formula (url/sha256/version, no bottle
      # block yet) — build-bottles/publish-bottles below build the precompiled
      # bottles against this exact file and merge the bottle block in before
      # anything is pushed to the tap.
      - name: Generate bare Homebrew formula
        id: homebrew-formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap bump (see docs/en/releasing.md#homebrew for one-time setup)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          node scripts/bump-homebrew-formula.mjs "${GITHUB_REF_NAME#v}" bare-formula.rb

          curl -fsSL -o current-formula.rb "https://raw.githubusercontent.com/elleVas/homebrew-cloudrift/main/Formula/cloudrift.rb" || true
          if [ -f current-formula.rb ] && diff -q current-formula.rb bare-formula.rb > /dev/null 2>&1; then
            echo "Formula already up to date, nothing to bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bare formula artifact
        if: steps.homebrew-formula.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula-bare
          path: bare-formula.rb
          if-no-files-found: error

    outputs:
      homebrew_enabled: ${{ steps.homebrew-formula.outputs.enabled }}
      homebrew_formula_changed: ${{ steps.homebrew-formula.outputs.changed }}

  # Builds a precompiled bottle per platform so `brew install cloudrift` never
  # needs to run `npm install`/Xcode Command Line Tools on the user's machine —
  # see the bottle decision in the Homebrew tap automation notes. Runs on the
  # exact bare formula generated above so every platform bottles the same
  # url/sha256.
  #
  # arm64 + Linux only, deliberately no Intel (macos-13) leg: cloudrift has no
  # native/compiled dependencies (pure Node, node:sqlite for the trend store),
  # so an Intel Mac with no bottle just falls back to Homebrew's normal
  # "install from source" path — i.e. the same `npm install` the formula
  # already runs, just done locally instead of prebuilt. macos-13 runners are
  # the scarcest GitHub-hosted pool and have been seen queuing for a long
  # time; there's no upside to gating (or even running) a bottle build for a
  # fallback that already works.
  build-bottles:
    name: Build Homebrew bottle (${{ matrix.platform }})
    needs: publish
    if: needs.publish.outputs.homebrew_enabled == 'true' && needs.publish.outputs.homebrew_formula_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout cloudrift repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/build-homebrew-bottle
        with:
          platform: ${{ matrix.platform }}

  # Merges the per-platform bottle specs into one bottle block, publishes the
  # bottle tarballs as tap release assets (root_url target), and opens the
  # same auto-merging PR the tap's audit CI already gates — now carrying the
  # bottle block instead of just the source url/sha256.
  publish-bottles:
    name: Publish bottles to the tap
    needs: build-bottles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: elleVas/homebrew-cloudrift

      - name: Download bare formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula-bare

      - name: Install formula into tap checkout
        run: mv bare-formula.rb Formula/cloudrift.rb

      - name: Download bottle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Tap and trust the local formula
        run: |
          brew tap elleVas/cloudrift "$PWD"
          brew trust ellevas/cloudrift

      - name: Merge bottle specs into the formula
        run: brew bottle --merge --write --no-commit *.bottle.json

      # Upload the tarballs before opening the PR so the tap's `brew audit
      # --online` check (required by branch protection) sees a formula whose
      # bottle root_url already resolves.
      - name: Create GitHub release with bottle tarballs
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "cloudrift-${VERSION}" *.bottle.tar.gz \
            --repo elleVas/homebrew-cloudrift \
            --title "cloudrift ${VERSION} bottles" \
            --notes "Precompiled Homebrew bottles for cloudrift ${VERSION} (macOS arm64, Linux)."

      - name: Open PR with the bottled formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          BRANCH="bump-${GITHUB_REF_NAME}"
          git checkout -b "$BRANCH"
          git config user.name "cloudrift-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/cloudrift.rb
          git commit -m "cloudrift ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/elleVas/homebrew-cloudrift.git" "$BRANCH"

          gh pr create --repo elleVas/homebrew-cloudrift \
            --title "cloudrift ${GITHUB_REF_NAME}" \
            --body "Automated bump (source + precompiled bottles for macOS arm64 and Linux) from the elleVas/cloudrift release workflow." \
            --head "$BRANCH" --base main
          gh pr merge --repo elleVas/homebrew-cloudrift --auto --squash "$BRANCH"
