name: Build Homebrew bottle
description: >
  Builds and uploads a precompiled Homebrew bottle for one platform against
  the bare formula generated by the release workflow's publish job.
inputs:
  platform:
    description: Bottle platform tag (macos-arm64, linux)
    required: true

runs:
  using: composite
  steps:
    # `path:` is required here: without it, checkout replaces the *entire*
    # job workspace with elleVas/homebrew-cloudrift's content — including
    # this composite action's own `action.yml`, since it lives in the
    # cloudrift checkout that would get overwritten. That leaves nothing
    # for actions/checkout's own end-of-job cleanup step to find when it
    # goes looking for the composite action definition, and the job fails
    # with a confusing "Can't find action.yml" error long after every
    # visible step already reported success.
    - name: Checkout tap repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        repository: elleVas/homebrew-cloudrift
        path: homebrew-tap

    - name: Download bare formula
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: homebrew-formula-bare

    - name: Install formula into tap checkout
      shell: bash
      run: mv bare-formula.rb homebrew-tap/Formula/cloudrift.rb

    # `brew tap NAME "$PWD"` below does a real `git clone` of this checkout —
    # it only ever sees committed history, so without this commit it would
    # silently clone the *previous* release's formula (the one still on
    # `main`) and build/bottle that instead of the version we're releasing.
    # Local-only: never pushed, just makes the upcoming clone see the bump.
    - name: Commit the formula locally so the tap clone sees it
      shell: bash
      working-directory: homebrew-tap
      run: |
        git config user.name "cloudrift-release-bot"
        git config user.email "actions@users.noreply.github.com"
        git add Formula/cloudrift.rb
        git commit -m "cloudrift ${GITHUB_REF_NAME}"

    # GitHub's macOS runners ship Homebrew preinstalled; ubuntu-latest doesn't,
    # so install it here to get identical brew commands on every platform.
    - name: Install Homebrew (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
        echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

    # Homebrew refuses to load formulae from a tap it doesn't recognize
    # (typosquatting protection) — same tap+trust sequence already verified
    # working on GitHub-hosted runners in the tap's own test-formula.yml.
    - name: Tap and trust the local formula
      shell: bash
      working-directory: homebrew-tap
      run: |
        brew tap elleVas/cloudrift "$PWD"
        brew trust ellevas/cloudrift

    - name: Build the bottle
      shell: bash
      run: brew install --formula --build-bottle cloudrift

    - name: Generate bottle spec
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        brew bottle --json --root-url="https://github.com/elleVas/homebrew-cloudrift/releases/download/cloudrift-${VERSION}" cloudrift

    - name: Upload bottle artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bottle-${{ inputs.platform }}
        path: |
          *.bottle.tar.gz
          *.bottle.json
        if-no-files-found: error
